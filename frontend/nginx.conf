server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app routing
    location / {
        try_files $uri /index.html;
    }

    # Production axios uses baseURL `/api`, while FastAPI mounts FTIR
    # routes at `/analysis`. Without this rewrite, POST /api/analysis/*
    # hits try_files and nginx returns 405 for index.html.
    location /api/analysis/ {
        client_max_body_size 20m;
        proxy_pass http://backend:8080/analysis/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy API to backend service in the same Docker network
    location /generate_graphs {
        proxy_pass http://backend:8080/generate_graphs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Proxy static files generated by backend
    location /static/ {
        proxy_pass http://backend:8080/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}
